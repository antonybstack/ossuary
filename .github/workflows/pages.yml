name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install
      - name: Build static site
        env:
          NITRO_PRESET: github_pages
        run: |
          set +e
          npm run build
          # Vite 8 / Nitro github-pages prerenders .output/public, then fails on a
          # leftover SSR rolldown step. The static site is already complete.
          test -f .output/public/index.html
          test -f .output/public/404.html
          mkdir -p .output/public/docs/screenshots
          cp -f docs/screenshots/*.svg .output/public/docs/screenshots/ || true
          touch .output/public/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
